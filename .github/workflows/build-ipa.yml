name: Build tweaked IPA

on:
  workflow_dispatch:
    inputs:
      decrypted_ipa_url:
        description: "Direct download URL of decrypted IPA (Catbox/pixeldrain)"
        required: true
        type: string
      bundle_id:
        description: "Bundle ID for the resulting app"
        required: false
        default: com.google.ios.youtube.tweaked
        type: string
      app_name:
        description: "Display name"
        required: false
        default: YouTube
        type: string
      publish_release:
        description: "Publish as draft GitHub Release (review then publish)"
        required: false
        default: false
        type: boolean
      build_trollfools_companion:
        description: "Also build .cyan + dylib zip for TrollFools"
        required: false
        default: true
        type: boolean
      enable_safari_extension:
        description: "OpenYouTubeSafariExtension ('Open in YouTube' Safari handler)"
        type: boolean
        default: false
      enable_youtube_x:
        description: "YouTube-X (ads / background / premium)"
        type: boolean
        default: true
      enable_youpip:
        description: "YouPiP (PiP)"
        type: boolean
        default: true
      enable_ytuhd:
        description: "YTUHD (4K unlock)"
        type: boolean
        default: true
      enable_youquality:
        description: "YouQuality (remember quality)"
        type: boolean
        default: true
      enable_return_youtube_dislikes:
        description: "Return YouTube Dislikes"
        type: boolean
        default: true
      enable_ytabconfig:
        description: "YTABConfig (settings UI)"
        type: boolean
        default: true
      enable_ytvideooverlay:
        description: "YTVideoOverlay (framework dep)"
        type: boolean
        default: true
      enable_donteatmycontent:
        description: "DontEatMyContent (notch safe-area)"
        type: boolean
        default: true
      enable_ytsideload:
        description: "YTSideload (fixes logout-on-relaunch)"
        type: boolean
        default: true

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prep:
    name: Compute enabled tweak list
    if: github.actor == 'eutudb23'
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.compute.outputs.json }}
      newline: ${{ steps.compute.outputs.newline }}
      pretty: ${{ steps.compute.outputs.pretty }}
    steps:
      - name: Mask sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@1.2.0
        with:
          exclude_inputs: bundle_id,app_name,publish_release,build_trollfools_companion,enable_safari_extension,enable_youtube_x,enable_youpip,enable_ytuhd,enable_youquality,enable_return_youtube_dislikes,enable_ytabconfig,enable_ytvideooverlay,enable_donteatmycontent,enable_ytsideload

      - id: compute
        env:
          ENABLE_YOUTUBE_X:               ${{ inputs.enable_youtube_x }}
          ENABLE_YOUPIP:                  ${{ inputs.enable_youpip }}
          ENABLE_YTUHD:                   ${{ inputs.enable_ytuhd }}
          ENABLE_YOUQUALITY:              ${{ inputs.enable_youquality }}
          ENABLE_RETURN_YOUTUBE_DISLIKES: ${{ inputs.enable_return_youtube_dislikes }}
          ENABLE_YTABCONFIG:              ${{ inputs.enable_ytabconfig }}
          ENABLE_YTVIDEOOVERLAY:          ${{ inputs.enable_ytvideooverlay }}
          ENABLE_DONTEATMYCONTENT:        ${{ inputs.enable_donteatmycontent }}
          ENABLE_YTSIDELOAD:              ${{ inputs.enable_ytsideload }}
          ENABLE_SAFARI_EXTENSION:        ${{ inputs.enable_safari_extension }}
        run: |
          # Single source of truth: tweaks.json names. build_all_tweaks.sh renames
          # every output to <Name>.<ext>, so the same name is used as build filter,
          # inject resolver, and human-readable label.
          NAMES=()
          [[ "$ENABLE_YTVIDEOOVERLAY"          == "true" ]] && NAMES+=("YTVideoOverlay")
          [[ "$ENABLE_YOUTUBE_X"               == "true" ]] && NAMES+=("YouTube-X")
          [[ "$ENABLE_YOUPIP"                  == "true" ]] && NAMES+=("YouPiP")
          [[ "$ENABLE_YTUHD"                   == "true" ]] && NAMES+=("YTUHD")
          [[ "$ENABLE_YOUQUALITY"              == "true" ]] && NAMES+=("YouQuality")
          [[ "$ENABLE_RETURN_YOUTUBE_DISLIKES" == "true" ]] && NAMES+=("Return-YouTube-Dislikes")
          if [[ "$ENABLE_YTABCONFIG" == "true" ]]; then
            NAMES+=("YouGroupSettings")   # silent runtime dep of YTABConfig
            NAMES+=("YTABConfig")
          fi
          [[ "$ENABLE_DONTEATMYCONTENT"        == "true" ]] && NAMES+=("DontEatMyContent")
          [[ "$ENABLE_YTSIDELOAD"              == "true" ]] && NAMES+=("YTSideload")
          [[ "$ENABLE_SAFARI_EXTENSION"        == "true" ]] && NAMES+=("OpenYouTubeSafariExtension")

          JSON=$(printf '%s\n' "${NAMES[@]}" | jq -R . | jq -sc .)
          NL=$(printf '%s\n' "${NAMES[@]}")
          PRETTY=$(printf '  - %s\n' "${NAMES[@]}")

          {
            echo "json=$JSON"
            echo "newline<<EOF"; echo "$NL"; echo "EOF"
            echo "pretty<<EOF"; echo "$PRETTY"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Enabled tweaks: $JSON"

  tweaks:
    needs: prep
    if: github.actor == 'eutudb23'
    uses: ./.github/workflows/build-tweaks.yml
    with:
      enabled_tweaks_json: ${{ needs.prep.outputs.json }}

  inject:
    name: Inject + repack IPA
    needs: [prep, tweaks]
    if: github.actor == 'eutudb23'
    runs-on: macos-latest
    steps:
      - name: Mask sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@1.2.0
        with:
          exclude_inputs: bundle_id,app_name,publish_release,build_trollfools_companion,enable_safari_extension,enable_youtube_x,enable_youpip,enable_ytuhd,enable_youquality,enable_return_youtube_dislikes,enable_ytabconfig,enable_ytvideooverlay,enable_donteatmycontent,enable_ytsideload

      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: built-debs
          path: built-debs

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cyan (pyzule-rw)
        run: |
          python -m pip install --upgrade pip pipx
          # Install pyzule-rw (cyan) straight from GitHub — not published to PyPI.
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          cyan --help | head -5

      - name: Inject + repack
        env:
          IPA_URL:        ${{ inputs.decrypted_ipa_url }}
          BUNDLE_ID:      ${{ inputs.bundle_id }}
          APP_NAME:       ${{ inputs.app_name }}
          ENABLED_TWEAKS: ${{ needs.prep.outputs.newline }}
          OUT_IPA: ${{ github.workspace }}/Tweaked_${{ github.run_number }}.ipa
        run: bash scripts/inject.sh

      - name: Probe IPA + write summary
        env:
          ENABLED_PRETTY: ${{ needs.prep.outputs.pretty }}
          IPA_PATH: ${{ github.workspace }}/Tweaked_${{ github.run_number }}.ipa
        run: |
          size_h=$(du -h "$IPA_PATH" | awk '{print $1}')
          src_bundle=$(unzip -p .inject/youtube.ipa 'Payload/*.app/Info.plist' 2>/dev/null \
            | plutil -extract CFBundleIdentifier raw - - 2>/dev/null || echo "unknown")
          cyan_ver=$(cyan --version 2>/dev/null || echo unknown)
          {
            echo "## Tweaked IPA built"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| output | \`$(basename "$IPA_PATH")\` |"
            echo "| size | $size_h |"
            echo "| source bundle id | \`$src_bundle\` |"
            echo "| target bundle id | \`${{ inputs.bundle_id }}\` |"
            echo "| display name | \`${{ inputs.app_name }}\` |"
            echo "| cyan | \`$cyan_ver\` |"
            echo "| run | \`${{ github.run_number }}\` |"
            echo ""
            echo "### Tweaks injected"
            echo "$ENABLED_PRETTY"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: Tweaked-ipa-${{ github.run_number }}
          path: Tweaked_${{ github.run_number }}.ipa
          retention-days: 90
          if-no-files-found: error

  trollfools:
    name: TrollFools companion (.cyan + dylib zip)
    if: ${{ inputs.build_trollfools_companion && github.actor == 'eutudb23' }}
    needs: [prep, tweaks]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: built-debs
          path: built-debs

      - run: brew install dpkg

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cyan (provides cgen)
        run: |
          python -m pip install --upgrade pip pipx
          # Install pyzule-rw (cyan) straight from GitHub — not published to PyPI.
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Generate .cyan re-injection bundle
        env:
          ENABLED_TWEAKS: ${{ needs.prep.outputs.newline }}
        run: |
          # build_all_tweaks.sh emits <Name>.<ext> exactly — match by name, not glob.
          INJECTS=()
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            for ext in deb dylib appex bundle; do
              if [[ -e "built-debs/${name}.${ext}" ]]; then
                INJECTS+=("built-debs/${name}.${ext}"); break
              fi
            done
          done <<<"$ENABLED_TWEAKS"
          echo "Including in .cyan: ${INJECTS[*]}"
          # cgen: -o output, -f file list, -b bundle id, -n display name,
          # -u remove UISupportedDevices, -w remove watch apps, -e remove extensions.
          # No `-i` (that's cyan's IPA input). No combined `-uwef` (that bundles -f).
          cgen \
            -o "Tweaked_${{ github.run_number }}.cyan" \
            -b "${{ inputs.bundle_id }}" \
            -n "${{ inputs.app_name }}" \
            -u -w -e \
            -f "${INJECTS[@]}"

      - name: Extract injectables for TrollFools zip
        env:
          ENABLED_TWEAKS: ${{ needs.prep.outputs.newline }}
        run: |
          set -e
          STAGE=$(mktemp -d)
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            deb="built-debs/${name}.deb"
            if [[ -f "$deb" ]]; then
              tmp=$(mktemp -d)
              dpkg-deb -x "$deb" "$tmp"
              find "$tmp" \( -name '*.dylib' -o -name '*.bundle' -o -name '*.framework' \) \
                -exec cp -R {} "$STAGE/" \;
              rm -rf "$tmp"
            else
              for ext in dylib appex bundle; do
                if [[ -e "built-debs/${name}.${ext}" ]]; then
                  cp -R "built-debs/${name}.${ext}" "$STAGE/"; break
                fi
              done
            fi
          done <<<"$ENABLED_TWEAKS"
          ls -lR "$STAGE"
          ( cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/Tweaked_${{ github.run_number }}-dylibs.zip" . )
          ls -lh "Tweaked_${{ github.run_number }}-dylibs.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: Tweaked-trollfools-${{ github.run_number }}
          path: |
            Tweaked_${{ github.run_number }}.cyan
            Tweaked_${{ github.run_number }}-dylibs.zip
          retention-days: 90
          if-no-files-found: error

  release:
    name: Publish draft release
    if: ${{ inputs.publish_release && github.actor == 'eutudb23' }}
    needs: [inject, trollfools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Tweaked-*-${{ github.run_number }}
          merge-multiple: true
          path: release-assets

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh release-assets/
          TAG="tweak-${{ github.run_number }}"
          gh release create "$TAG" \
            --draft \
            --title "Tweaked ${{ inputs.app_name }} #${{ github.run_number }}" \
            --notes "Built from tweaks.json @ \`${{ github.sha }}\`. Sign locally with Feather / AltStore / Sideloadly / ESign, or install via TrollStore." \
            release-assets/*
