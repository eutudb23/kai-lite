name: Build tweaks (.deb)

on:
  workflow_call:
    inputs:
      enabled_tweaks_json:
        description: 'JSON array of tweak names to build (empty = all)'
        required: false
        type: string
        default: ''
    outputs:
      artifact:
        description: "Name of the artifact containing built .deb files"
        value: built-debs
  workflow_dispatch:
    inputs:
      enabled_tweaks_json:
        description: 'JSON array of tweak names to build (empty = all)'
        required: false
        type: string
        default: ''

concurrency:
  group: build-tweaks-${{ github.ref }}-${{ inputs.enabled_tweaks_json }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all tweaks
    if: github.actor == 'eutudb23'
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_COMMIT: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
      IOS_SDK: iPhoneOS16.5.sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Write filter to file (for cache-key hashing)
        env:
          FILTER: ${{ inputs.enabled_tweaks_json }}
        run: printf '%s' "${FILTER:-all}" > .cache-filter.txt

      - name: Cache built .deb files
        id: cache-debs
        uses: actions/cache@v5
        with:
          path: built-debs
          key: debs-${{ runner.os }}-${{ hashFiles('tweaks.json', '.cache-filter.txt', 'scripts/build_all_tweaks.sh', 'tweaks/**/*.x', 'tweaks/**/*.m', 'tweaks/**/*.h', 'tweaks/**/Makefile', 'tweaks/**/control', 'tweaks/**/*.plist', 'tweaks/**/Localizable.strings') }}

      - name: Install build tools
        if: steps.cache-debs.outputs.cache-hit != 'true'
        run: |
          # macos-14 preinstalls jq/gh/xz/coreutils, but /usr/bin/make is GNU Make 3.81 (too old
          # for Theos's parallel build). Install the brew formula and front-load gnubin on PATH.
          # GitHub's runner image may retain aws/tap, which this workflow does not use. Remove it
          # instead of trusting an unrelated third-party tap or disabling Homebrew's trust checks.
          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap
          fi
          brew update
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Checkout Theos (validates SHA up-front)
        if: steps.cache-debs.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          ref: ${{ env.THEOS_COMMIT }}
          path: theos
          submodules: recursive

      - name: Sparse-clone iPhoneOS SDK
        if: steps.cache-debs.outputs.cache-hit != 'true'
        run: |
          # Only pull the one SDK we use (saves ~1-2 min vs master.zip of all SDKs).
          tmp=$(mktemp -d)
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks "$tmp"
          git -C "$tmp" sparse-checkout set --no-cone "$IOS_SDK"
          git -C "$tmp" checkout
          mkdir -p "$THEOS/sdks"
          mv "$tmp/$IOS_SDK" "$THEOS/sdks/"
          ls "$THEOS/sdks/"

      - name: Build tweaks
        if: steps.cache-debs.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_FILTER: ${{ inputs.enabled_tweaks_json }}
        run: bash scripts/build_all_tweaks.sh

      - name: List artifacts
        run: ls -lh built-debs/ || echo "no debs (empty filter?)"

      - name: Upload built-debs artifact
        uses: actions/upload-artifact@v7
        with:
          name: built-debs
          path: |
            built-debs/*.deb
            built-debs/*.appex
            built-debs/*.dylib
          retention-days: 30
          if-no-files-found: error
